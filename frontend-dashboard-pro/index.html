  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  <script>
    (function () {
      function cardFor(label) {
        var labels = Array.from(document.querySelectorAll("div")).filter(function (element) {
          return element.textContent.trim() === label;
        });
        var labelElement = labels[0];
        while (labelElement && !labelElement.className.toString().includes("min-h-[132px]")) {
          labelElement = labelElement.parentElement;
        }
        return labelElement;
      }

      function setCardValue(label, pattern, value) {
        var card = cardFor(label);
        if (!card) return;
        var target = Array.from(card.querySelectorAll("div,span")).find(function (element) {
          return pattern.test(element.textContent.trim()) && element.children.length === 0;
        });
        if (target) target.textContent = String(value);
      }

      async function refreshLiveValues() {
        try {
          var response = await fetch("/api/monitoring/status", { cache: "no-store" });
          if (!response.ok) return;
          var status = await response.json();
          setCardValue("Puissance Agrégée", /^\d+(\.\d+)?$/, Number(status.total_MW).toFixed(1));
          setCardValue("Énergie Stockée", /^\d+(\.\d+)?$/, status.total_MWh);
          setCardValue("Fréquence Senelec", /^\d+(\.\d+)?$/, Number(status.freq_Hz).toFixed(2));
          setCardValue("Temps de Réponse", /^\d+(\.\d+)?$/, status.response_ms);
        } catch (error) {
          // Keep the original monitoring display when the API is unavailable.
        }
      }

      setInterval(refreshLiveValues, 5000);
      refreshLiveValues();
    })();
  </script>
